<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:site_name" content="Coxilo">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_AU">
<meta name="theme-color" content="#F7F7F1">
<link rel="icon" href="{{root}}assets/images/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..600,50&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{root}}assets/css/styles.css">
</head>
<body>
<div class="site" data-page="{{page}}">
<a class="skip-link" href="#main">Skip to content</a>
{{> header}}
<main id="main" tabindex="-1">
{{content}}
</main>
{{> footer}}
</div>
{{> dialogs}}
<script src="{{root}}assets/js/catalog.js"></script>
<script src="{{root}}assets/js/commerce/local-preview-adapter.js"></script>
<script src="{{root}}assets/js/app.js"></script>
</body>
</html>
